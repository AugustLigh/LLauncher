[package]
name = "llauncher"
version = "0.3.3"
description = "Launcher for Arknights: Endfield"
authors = ["you"]
edition = "2021"

[lib]
name = "llauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the borderless, transparent main window needs it on
# macOS (Tauri renders such windows through private AppKit calls there; fine
# outside the App Store). It has to sit here, on the main dependency, with
# `app.macOSPrivateApi` in the base config to match: tauri-build compares the
# two literally and does not see a target-specific entry. A no-op elsewhere.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "net", "macros"] }
thiserror = "2"
md-5 = "0.10"
base64 = "0.22"
crc32fast = "1"
futures-util = "0.3"
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate", "deflate64"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
discord-rich-presence = "1.1.0"

# `killpg`/`statvfs`: the POSIX bits of process control and free-space probing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Session-bus sleep inhibitors and the "turn off screen" call. Already in
# the tree through the notification plugin, so this adds no build weight.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Win32 equivalents: free space (GetDiskFreeSpaceExW), waiting on a process
# handle, the elevated launch path (ShellExecuteExW), the per-app graphics
# entry in the registry and the power plan swapped in for a session.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
