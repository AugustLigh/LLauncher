name: Release

# Builds on Ubuntu 22.04 LTS so the bundles link against an older glibc/openssl
# and run on a wider range of distributions than a build from a rolling/recent
# host would.
# Triggered explicitly (update.sh runs `gh workflow run release.yml -f tag=X`)
# rather than on tag push, so a local release (`update.sh X --local`) never
# races with a CI build for the same tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. 0.2.2)"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            glib-networking

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "LLauncher ${{ github.event.inputs.tag }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: false
          prerelease: false

  # Releases created with the default GITHUB_TOKEN do not fire the `release`
  # event for other workflows, so the AUR update is chained here explicitly.
  aur-publish:
    needs: build
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets: inherit

  # Same for the .flatpak bundle: built from the tag and attached to the
  # release created above.
  flatpak:
    needs: build
    uses: ./.github/workflows/flatpak.yml
    with:
      tag: ${{ github.event.inputs.tag }}
    permissions:
      contents: write
