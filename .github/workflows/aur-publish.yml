name: Publish AUR package

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. 0.2.2)"
        required: true

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Bump PKGBUILD version
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${{ steps.ver.outputs.version }}/" \
                 -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: llauncher-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.ver.outputs.version }}"

  # Prove the published package actually installs: makepkg -si in a clean
  # Arch container, the same path an AUR helper takes.
  verify:
    needs: aur-publish
    uses: ./.github/workflows/aur-verify.yml

